<title>Steady Family Budget</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: sticky header with month switcher + tabs; overview is a two-column board (now / plan) that stacks on phones. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#E4E9F1; --ink:#152033; --muted:#566275; --line:#D3DAE5;
  --accent:#4740C4; --accent-2:#8A3FC8; --accent-ink:#FFFFFF; --accent-bg:#E6E4FB; --sky:#1F7FB8; --sky-bg:#DDEFFA;
  --adults:#2F67A8; --adults-bg:#E1ECF8; --baby:#B83E72; --baby-bg:#F8E3EC; --pets:#0E7A70; --pets-bg:#DDF2EF; --house:#6B5A2E; --house-bg:#F1EBDC;
  --good:#1E7B45; --good-bg:#DDF1E4; --warn:#9A6200; --warn-bg:#FBEFD6; --bad:#B53A24; --bad-bg:#FBE2DC;
  --shadow:0 1px 2px rgba(21,32,51,.06),0 6px 20px rgba(21,32,51,.06);
  --f-display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F131A; --surface:#171D27; --surface-2:#202836; --ink:#E7ECF3; --muted:#9BA7B8; --line:#2A3342;
  --accent:#9C97FF; --accent-2:#D69CFF; --accent-ink:#121029; --accent-bg:#26244A; --sky:#7CC4F0; --sky-bg:#14293A;
  --adults:#86B4E8; --adults-bg:#1B2A3D; --baby:#F09AC0; --baby-bg:#3A1E2C; --pets:#5CCFC2; --pets-bg:#12312E; --house:#D8C08A; --house-bg:#2E2817;
  --good:#5FD08F; --good-bg:#14301F; --warn:#F0B95A; --warn-bg:#352812; --bad:#FF8A70; --bad-bg:#3A1A14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F131A; --surface:#171D27; --surface-2:#202836; --ink:#E7ECF3; --muted:#9BA7B8; --line:#2A3342;
  --accent:#9C97FF; --accent-2:#D69CFF; --accent-ink:#121029; --accent-bg:#26244A; --sky:#7CC4F0; --sky-bg:#14293A;
  --adults:#86B4E8; --adults-bg:#1B2A3D; --baby:#F09AC0; --baby-bg:#3A1E2C; --pets:#5CCFC2; --pets-bg:#12312E; --house:#D8C08A; --house-bg:#2E2817;
  --good:#5FD08F; --good-bg:#14301F; --warn:#F0B95A; --warn-bg:#352812; --bad:#FF8A70; --bad-bg:#3A1A14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:800}
h3{font-size:1rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.label{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in,.tabs-in,.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px 8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;flex:none;border-radius:10px;background:var(--accent);position:relative;overflow:hidden}
.logo::before,.logo::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;top:9px;border:3px solid var(--accent-ink)}
.logo::before{left:5px}.logo::after{left:13px;opacity:.75}
.brand h1{font-size:1.2rem;font-weight:800;white-space:nowrap}
.sync{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--good)}.sync.local i{background:var(--warn)}
.monthnav{display:flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:12px;padding:3px}
.monthnav button{border:0;background:transparent;border-radius:9px;min-height:38px;padding:0 12px}
.monthnav .arrow{font-size:1.25rem;width:40px;padding:0}
.monthnav button:hover{background:var(--surface)}
.mlabel{font-weight:700;min-width:9.5em}
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs-in{display:flex;gap:4px;padding-block:0}
.tab{border:0;background:none;padding:10px 12px 12px;border-bottom:3px solid transparent;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main.wrap{padding-block:20px 120px;display:block}
.view{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid-ov{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
@media (max-width:880px){.grid-ov{grid-template-columns:minmax(0,1fr)}}

/* status hero */
.status{border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line)}
.status.good{background:var(--good-bg)}.status.warn{background:var(--warn-bg)}.status.bad{background:var(--bad-bg)}.status.plan{background:var(--accent-bg)}
.badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1.35rem}
.badge .dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 0 4px var(--surface)}
.good .dot{background:var(--good)}.warn .dot{background:var(--warn)}.bad .dot{background:var(--bad)}.plan .dot{background:var(--accent)}
.status ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:12px 14px}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-width:0}
.kpi .big{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:1.6rem;font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.kpi.hero{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.kpi.hero .label,.kpi.hero .muted{color:inherit;opacity:.85}
.kpi.protect{background:var(--baby-bg);border-color:transparent}
.kpi.short{background:var(--bad-bg)}
@media (max-width:420px){.kpi .big{font-size:1.3rem}.kpi{padding:12px}}
.meter{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.meter>span{display:block;height:100%;border-radius:99px;background:var(--good)}
.meter.warn>span{background:var(--warn)}.meter.bad>span{background:var(--bad)}
.meter .pace{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}
.kpi.hero .meter{background:rgba(255,255,255,.25)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;min-height:40px;padding:0 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:32px;padding:0 10px;font-size:.88rem;border-radius:9px}
.kpi.hero .btn{background:rgba(255,255,255,.18);border-color:transparent;color:inherit}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* lists */
.list{display:flex;flex-direction:column}
.dayhead{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:12px 0 4px}
.dayhead:first-child{padding-top:0}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dayhead+.row{border-top:0}
.row .nm{font-weight:600;overflow-wrap:anywhere}
.row .meta{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.row .amt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.gdot{width:10px;height:10px;border-radius:3px;background:var(--muted)}
.gdot.move{width:22px;height:22px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.gdot.adults{background:var(--adults)}.gdot.baby{background:var(--baby)}.gdot.pets{background:var(--pets)}.gdot.household{background:var(--house)}.gdot.in{background:var(--good);border-radius:50%}.gdot.protect{background:var(--baby);border-radius:50%}
.plus{color:var(--good)}
.overdue .nm{color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;border-radius:99px;padding:2px 8px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.ex{background:var(--warn-bg);color:var(--warn)}
.pill.lock{background:var(--accent-bg);color:var(--accent)}
.pill.adults{background:var(--adults-bg);color:var(--adults)}.pill.baby{background:var(--baby-bg);color:var(--baby)}.pill.pets{background:var(--pets-bg);color:var(--pets)}.pill.household{background:var(--house-bg);color:var(--house)}
.paidbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;font-size:.8rem;font-weight:700;padding:3px 10px;min-height:30px}
.paidbtn.on{background:var(--good-bg);border-color:transparent;color:var(--good)}
.task{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px;border-radius:12px;background:var(--accent-bg);margin-bottom:10px}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

/* paycheck flow */
.flow{display:flex;flex-direction:column;gap:10px}
.pay{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.pay-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.pay-h b{font-family:var(--f-display);font-size:1.02rem}
.line{display:flex;justify-content:space-between;gap:10px;font-size:.92rem}
.line span:first-child{color:var(--muted);min-width:0}
.line .num{white-space:nowrap;flex:none}
.d-xrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:6px;align-items:center}
.d-xrow>*{min-width:0}.d-xrow input{width:100%}.d-xdel{min-width:40px;justify-content:center}
.line.total{border-top:1px solid var(--line);padding-top:6px;font-weight:700}
.line.total span:first-child{color:var(--ink)}
.pay.bonus{background:var(--accent-bg);border-color:transparent}
.pay.ccb{background:var(--baby-bg);border-color:transparent}
.sumrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:4px}
.sumrow div{background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.sumrow .num{font-weight:600;overflow-wrap:anywhere}


/* savings */
.save{display:flex;flex-direction:column;gap:8px}
.save + .save{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.save .big{font-family:var(--f-num);font-size:1.5rem;font-weight:600}
.goalbar{position:relative;height:14px;border-radius:99px;background:var(--surface-2);overflow:visible}
.goalbar>span{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent)}
.goalbar.child>span{background:var(--baby)}
.goalbar .mark{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* chart + tables */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.chart .bar{fill:var(--accent)}.chart .bar.now{fill:var(--accent);opacity:.55}
.chart .grid{stroke:var(--line)}.chart .goal{stroke:var(--good);stroke-dasharray:5 4;stroke-width:2}
.chart .goaltxt{fill:var(--good);font-weight:700}
.chart .val{fill:var(--ink);font-weight:700;font-family:var(--f-num)}
.tablewrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:520px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
th:first-child,td:first-child{text-align:left}
td.num{font-family:var(--f-num)}
.chip3{display:inline-block;font-size:.68rem;font-weight:700;background:var(--accent-bg);color:var(--accent);border-radius:99px;padding:1px 6px;margin-left:4px}

/* category bars */
.cats{display:flex;flex-direction:column;gap:10px}
.cat{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.9rem}
.cat .meter>span{background:var(--accent)}
.cat .meter.food>span{background:var(--good)}

/* food halves */
.halves{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.halves{grid-template-columns:minmax(0,1fr)}}
.half{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.half.now{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}

/* group tabs (fixed bills) */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.seg button b{font-family:var(--f-display);font-size:1.05rem}
.seg button .num{font-size:.95rem}
.seg button[aria-pressed="true"].adults{border-color:var(--adults);background:var(--adults-bg)}
.seg button[aria-pressed="true"].baby{border-color:var(--baby);background:var(--baby-bg)}
.seg button[aria-pressed="true"].pets{border-color:var(--pets);background:var(--pets-bg)}
.grouphead{border-radius:16px 16px 0 0;margin:-16px -16px 14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grouphead.adults{background:var(--adults-bg)}.grouphead.baby{background:var(--baby-bg)}.grouphead.pets{background:var(--pets-bg)}
.grouphead h2{font-size:1.3rem}
.grouphead.adults h2{color:var(--adults)}.grouphead.baby h2{color:var(--baby)}.grouphead.pets h2{color:var(--pets)}
.billrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.billrow:first-of-type{border-top:0}
@media (max-width:480px){.billrow{grid-template-columns:minmax(0,1fr) auto}.billrow .editcell{grid-column:1/-1;justify-self:start}}

/* forms */
.form{display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-weight:600;font-size:.92rem}
.field .hint{font-size:.8rem;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=month],input:not([type]),select,textarea{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:11px;background:var(--surface);padding:8px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-bg)}
input[disabled],select[disabled]{background:var(--surface-2);color:var(--muted)}
.money{position:relative}
.money::before{content:"$";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-family:var(--f-num)}
.money input{padding-left:26px;font-family:var(--f-num)}
.err{color:var(--bad);font-weight:600;font-size:.9rem}
.sec-title{display:flex;align-items:center;gap:8px;margin-bottom:10px}

/* sheet */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,14,22,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(560px,100%);max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:20px;padding:22px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-h h2{font-size:1.35rem}
.x{border:0;background:var(--surface-2);width:38px;height:38px;border-radius:50%;font-size:1.2rem}
.step{display:flex;align-items:center;gap:10px;font-weight:700}
.stepn{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.85rem;flex:none}
.bigamt{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:14px;padding:4px 14px}
.bigamt span{font-family:var(--f-num);font-size:1.8rem;color:var(--muted)}
.bigamt input{border:0!important;box-shadow:none!important;font-family:var(--f-num);font-size:2rem;padding:6px 0;min-height:56px;background:transparent}
.bigamt:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chips span{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);font-weight:600;font-size:.92rem}
.chips input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chips input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.chips .food span{border-color:var(--good)}
.daterow{display:flex;gap:8px;flex-wrap:wrap}
.daterow input{flex:1 1 160px;width:auto}
details{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:10px}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:20px;height:20px;margin-top:2px;flex:none}

.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;border:0;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 20px;min-height:54px;box-shadow:0 8px 24px rgba(40,34,140,.35);font-size:1rem;display:flex;align-items:center;gap:8px}
.fab b{font-size:1.4rem;line-height:1}

/* ---------- encrypted backups: AES-256-GCM, key from the password with PBKDF2-SHA256 ---------- */
const B64={enc:u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)},dec:b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0))};

  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptBackup(obj,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iter=600000;
  const key=await deriveKey(pw,salt,iter),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj))));
  return JSON.stringify({format:'family-budget-backup',version:1,note:'Encrypted budget backup. It can only be opened in the budget app with the password it was made with.',cipher:'AES-256-GCM',kdf:'PBKDF2-SHA256',iterations:iter,salt:B64.enc(salt),iv:B64.enc(iv),data:B64.enc(ct)})}
async function decryptBackup(text,pw){let env;try{env=JSON.parse(String(text).trim())}catch(e){throw new Error('notbackup')}
  if(!env||env.format!=='family-budget-backup'||!env.data)throw new Error('notbackup');
  const key=await deriveKey(pw,B64.dec(env.salt),env.iterations||600000);let pt;
  try{pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:B64.dec(env.iv)},key,B64.dec(env.data))}catch(e){throw new Error('password')}

/* combine two copies of the budget: newest change wins for each item; spending from both is kept; deletions carry over */
function mergeData(a,b){
  a=a||{};b=b||{};const out={},ta=a['meta/tombstones']||{},tb=b['meta/tombstones']||{},tomb={};
  for(const k of new Set([...Object.keys(ta),...Object.keys(tb)]))tomb[k]=Math.max(num(ta[k]),num(tb[k]));
  const keys=new Set([...Object.keys(a),...Object.keys(b)]);keys.delete('meta/tombstones');
  const st={added:0,updated:0,removed:0};
  for(const k of keys){const x=a[k],y=b[k];let v;
    if(x&&!y)v=x;else if(!x&&y){v=y;st.added++}
    else{const ux=num(x._u),uy=num(y._u);
      if(/^months\/\d{4}-\d{2}$/.test(k)){v=JSON.parse(JSON.stringify(uy>ux?y:x));
        for(const f of['paid','moves']){const o=Object.assign({},x[f]||{});for(const kk in(y[f]||{}))o[kk]=!!(o[kk]||y[f][kk]);if(Object.keys(o).length)v[f]=o}
        v._u=Math.max(ux,uy)}

      if(JSON.stringify(v)!==JSON.stringify(x))st.updated++}
    const t=tomb[k];if(t&&t>=num(v&&v._u)){if(x)st.removed++;else if(y)st.added--;continue}
    out[k]=v}

function enqueue(p,fn){const q=(queues[p]||Promise.resolve()).then(fn,fn);queues[p]=q.catch(()=>{});return q}
function write(p,fn){

  return enqueue(p,async()=>{try{await fn();return true}catch(e){writeError(e);return false}});

function getStatus(c,up,phase,today,s){
  const pts=[];let tone='good';const bump=t=>{if(t==='bad'||(t==='warn'&&tone==='good'))tone=t};
  if(phase==='past'){return{tone:'plan',label:c.closed?'Locked month':'Finished month',pts:[c.net<0?`Ended ${fmt(-c.net)} short.`:`Ended with ${fmt(c.net)} left over for savings.`]}}
  if(phase==='future'&&!(c.ym===s.startYm)){
    if(c.net<0)return{tone:'bad',label:'Plan needs work',pts:[`Bills and food add up to ${fmt(-c.net)} more than the income for ${monthOnly(c.ym)}.`]};
    return{tone:'plan',label:'Plan looks good',pts:[`About ${fmt(c.target)} should go to Emergency Savings in ${monthOnly(c.ym)}.`]};
  }
  const overdue=up.filter(e=>e.kind==='bill'&&e.overdue);
  const soon=up.filter(e=>e.kind==='bill'&&!e.paid&&!e.overdue&&diffDays(today,e.date)<=3);
  if(c.net<0){bump('bad');pts.push(`This month is ${fmt(-c.net)} short. Cover it from Emergency Savings first. Use the Child Reserve only as a last resort.`)}
  if(overdue.length){bump('bad');pts.push(`${overdue.length} bill${overdue.length>1?'s are':' is'} past due (${fmt(C.sum(overdue.map(e=>e.amount)))}). Pay ${overdue.length>1?'them':'it'}, then tap Paid.`)}
  if(ymOf(today)===c.ym){const fp=C.foodPeriod(c,today,s);
    if(fp.spent>fp.allow){bump('warn');pts.push(`Food is ${fmt(fp.spent-fp.allow)} over for this half of the month.`)}
    else if(fp.spent>fp.expected+10){bump('warn');pts.push(`Food spending is ahead of pace. Aim for ${fmt(fp.perDay)} a day until ${dShort(fp.end)}.`)}
    else pts.push(`Food: ${fmt(fp.left)} left until ${dShort(fp.end)} (${fmt(fp.perDay)} a day).`)}
  const mvLate=up.filter(e=>e.kind==='move'&&e.overdue),mvToday=up.filter(e=>e.kind==='move'&&!e.done&&e.date===today);
  if(mvLate.length){bump('warn');pts.push(`${mvLate.length} money move${mvLate.length>1?'s':''} still to do from earlier days. See Coming up.`)}
  if(mvToday.length)pts.push(`${mvToday.length} money move${mvToday.length>1?'s':''} to do today (${fmt(C.sum(mvToday.map(e=>e.amount)))}).`);
  if(c.deferredTotal)pts.push(`Deferring ${c.billLines.filter(l=>l.deferredTo).length} bill${c.billLines.filter(l=>l.deferredTo).length>1?'s':''} to later (${fmt(c.deferredTotal)}).`);
  if(c.skippedTotal)pts.push(`Giving up ${fmt(c.skippedTotal)} of non-essential bills this month.`);
  if(soon.length){bump('warn');pts.push(`${soon.length} bill${soon.length>1?'s':''} due in the next 3 days (${fmt(C.sum(soon.map(e=>e.amount)))}).`)}
  if(tone==='good'&&!pts.length)pts.push('Bills are covered and the plan balances.');
  if(tone==='good'&&c.liveSurplus>=0)pts.unshift(`Everything is covered. ${fmt(Math.max(0,c.liveSurplus))} is on track for savings this month.`);
  return{tone,label:{good:'All good · On track',warn:'Heads up',bad:'Needs attention'}[tone],pts};
}

function programsCard(T){
  const s=T.settings,y=todayStr().slice(0,4),A=C.accountsOf(s),funds=C.fundsOf(s),inc=s.familyIncome;
  const contribFor=acctId=>{let t=0;for(const f of funds.filter(f=>f.account===acctId))for(const ym in T.months)if(ym.startsWith(y)){const m=T.months[ym];if(m&&m.moved&&num(m.moved[f.key])>0)t+=num(m.moved[f.key])}return round2(t)};
  const reg=A.filter(a=>a.type==='savings'&&['tfsa','rdsp','resp','fhsa'].includes(a.kind));
  const rows=reg.map(a=>{const c=contribFor(a.id),k=a.kind;let txt='';
    if(k==='rdsp'){const r=rdspMoney(c,inc);txt=`Put in ${fmt(c)} this year → about <b>${fmt(r.grant)}</b> in grant${r.bond==null?'. Enter your family income below to estimate the bond (up to $1,000 a year, no deposit needed).':r.bond>0?` plus <b>${fmt(r.bond)}</b> bond (no deposit needed).`:'.'} ${c<500?`Putting in ${fmt(500-c)} more would earn ${fmt(rdspMoney(500,inc).grant-r.grant)} more grant.`:''} RDSP money is fully exempt for ODSP.`}
    else if(k==='resp'){const r=respMoney(c,inc);txt=`Put in ${fmt(c)} this year → about <b>${fmt(r.grant)}</b> in grants (20%, plus more for low income on the first $500).${c<500?` The first $500 earns the most.`:''}`}
    else if(k==='tfsa')txt=`New room in ${y}: ${fmt(PROG.tfsa)}. Growth and withdrawals are tax-free and don't lower federal benefits like the CCB.${hasOdsp(s)?' ODSP\'s directives don\'t list TFSAs as exempt, so expect it to count toward the asset limit.':''}`;
    else if(k==='fhsa')txt=`Up to ${fmt(PROG.fhsa)} a year, tax-free when used for a first home.`;
    return`<div class="row"><span class="gdot in"></span><div><div class="nm">${esc(a.name)} <span class="pill">${esc((SAV_KINDS.find(x=>x[0]===k)||[])[1])}</span></div><div class="meta" style="white-space:normal">${txt}</div></div></div>`}).join('');
  const kinds=new Set(reg.map(a=>a.kind)),ideas=[];
  if(hasOdsp(s)&&!kinds.has('rdsp'))ideas.push(`<li><b>RDSP</b>: for someone approved for the Disability Tax Credit. With low family income the government adds up to <b>$1,000 a year</b> with no deposit needed, and triples the first $500 you put in. RDSP money doesn't count for ODSP. <a href="${PROG_LINKS.rdsp}" target="_blank" rel="noopener">How much you could get</a></li>`);
  if(!kinds.has('resp')&&(C.creditsOf(s).some(x=>x.protect)||isDate(s.babyDue)))ideas.push(`<li><b>RESP</b>: the government adds 20% of what you put in (more for low income), on top of the Canada Learning Bond. <a href="${PROG_LINKS.resp}" target="_blank" rel="noopener">Grant details</a></li>`);
  if(!kinds.has('tfsa'))ideas.push(`<li><b>TFSA</b>: savings grow tax-free, and money taken out doesn't lower federal benefits.</li>`);
  /* ODSP asset limit, from the last balance check */
  const aSrc=C.incomesOf(s).find(x=>{const k=C.assistOf(x);return k&&C.ASSIST[k].assets});
  let asset='';if(aSrc){const P=C.ASSIST[C.assistOf(aSrc)],od=C.dedCfg(s,aSrc),lim=(od.couple?P.assets.couple:P.assets.single)+P.assets.dep*num(od.deps),ck=lastCheckin();
    if(ck&&ck.bal){const counted=round2(A.filter(a=>!(a.type==='savings'&&['rdsp','resp'].includes(a.kind))).reduce((t,a)=>t+Math.max(0,num(ck.bal[a.id])),0)),pct=Math.min(100,counted/lim*100);
      asset=`<div class="save" style="margin-top:12px"><div class="card-h" style="margin:0"><span class="label">${esc(P.short)} asset limit</span><span class="small muted">From your balance check on ${dShort(ck.date)}</span></div>
        <div class="goalbar"><span style="width:${pct}%;background:${pct>=90?'var(--bad)':pct>=75?'var(--warn)':'var(--good)'}"></span></div>
        <div class="legend"><span>Counted: <b class="num">${fmt(counted)}</b> of ${fmt0(lim)}</span><span>${P.short==='ODSP'?"RDSPs and RESPs aren't counted":"RDSPs and RESPs left out; check with your worker"}</span></div>${pct>=75?'<p class="small" style="color:var(--bad)">Getting close to the limit. Money in an RDSP doesn\'t count, if someone qualifies.</p>':''}</div>`}
    else asset=`<p class="small muted" style="margin-top:10px">Do a balance check on the Today screen to see how close you are to the ${esc(P.short)} asset limit.</p>`}
  if(!rows&&!ideas.length&&!asset)return'';
  return`<section class="card"><div class="card-h"><div class="ttl">${ico('gift')}<h2>Savings programs</h2></div><span class="small muted">Free government money and tax-free savings</span></div>
    ${rows?`<div class="list">${rows}</div>`:''}
    ${ideas.length?`<p class="small" style="margin-top:${rows?'12px':'0'}"><b>Worth looking into</b></p><ul class="small" style="margin:6px 0 0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px">${ideas.join('')}</ul>`:''}
    ${asset}
    ${rows?'<p class="small muted" style="margin-top:8px">Estimates use money moved into savings funds kept in each account this year. Set an account\'s kind on the Accounts tab.</p>':''}</section>`;
}
/* bar charts: the spec is kept on the element and redrawn at the box's real width */
let chartN=0;
function chartBox(sp){return`<div class="chart" data-spec="${esc(JSON.stringify(sp))}">${drawChart(sp,600)}</div>`}
function drawChart(sp,W){
  const H=sp.H||220,pl=52,pr=8,pt=24,pb=28,iw=W-pl-pr,ih=H-pt-pb,y=v=>pt+ih-(Math.max(0,v)/sp.max)*ih,n=sp.bars.length,bw=iw/n,w=Math.min(bw*0.62,76),k=++chartN;
  let g='';for(let v=0;v<=sp.max+0.01;v+=sp.step)g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${fmt0(v)}</text>`;
  if(sp.goal)g+=`<line class="goal" x1="${pl}" x2="${W-pr}" y1="${y(sp.goal.v)}" y2="${y(sp.goal.v)}"/><text class="goaltxt" x="${W-pr}" y="${y(sp.goal.v)-6}" text-anchor="end">${esc(sp.goal.label)}</text>`;
  const bars=sp.bars.map((b,i)=>{const x=pl+i*bw+(bw-w)/2,cx=x+w/2,segs=(b.segs||[]).filter(s=>s[0]>0),tot=C.sum(segs.map(s=>s[0]));
    let acc=0,r='';for(const s of segs){const y1=y(acc+s[0]),hh=y(acc)-y1;acc+=s[0];r+=`<rect x="${x}" y="${y1}" width="${w}" height="${Math.max(0,hh)}" style="fill:${s[1]}"><title>${esc(s[2]||'')}</title></rect>`}
    const top=tot>0?y(tot):y(0),rad=Math.min(7,w/4);
    return(tot>0?`<clipPath id="cp${k}-${i}"><rect x="${x}" y="${top}" width="${w}" height="${y(0)-top}" rx="${rad}"/></clipPath><g class="bar${b.cls?' '+b.cls:''}"><g clip-path="url(#cp${k}-${i})">${r}</g></g>`:'')+
      (b.top?`<text class="val" x="${cx}" y="${top-7}" text-anchor="middle"${b.topColor?` style="fill:${b.topColor}"`:''}>${esc(b.top)}</text>`:'')+
      `<text x="${cx}" y="${H-8}" text-anchor="middle">${esc(b.label)}</text>`}).join('');
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(sp.aria||'')}">${g}${bars}</svg>`}
function fitCharts(){for(const el of main.querySelectorAll('.chart[data-spec]')){const W=Math.round(el.clientWidth);if(!W||W===+el.dataset.w)continue;
  try{el.innerHTML=drawChart(JSON.parse(el.dataset.spec),Math.max(260,W));el.dataset.w=W}catch(e){}}}
{let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(fitCharts,120)})}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1))),f=x/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function projectionCard(T,today){
  const s=T.settings,cur=ymOf(today),from=isYm(s.startYm)&&s.startYm>cur?s.startYm:cur;
  const rows=C.projection(T,today,from,6);const goal=num(s.emergencyGoal);
  let max=Math.max(goal,...rows.map(r=>Math.max(0,r.em)),1);const step=niceStep(max/4);max=Math.ceil(max/step)*step;
  const spec={H:210,max,step,aria:'Projected Emergency Savings by month',goal:goal>0?{v:goal,label:'Goal '+fmt0(goal)}:null,
    bars:rows.map((r,i)=>({label:monthShort(r.ym)+(r.bonus?'*':''),cls:i===0?'now':'',segs:[[r.em,'var(--accent)',`${monthShort(r.ym)}: ${fmt(r.em)}`]],
      top:r.em<0||i===0||i===rows.length-1?fmt0(r.em):'',topColor:r.em<0?'var(--bad)':''}))};
  const table=rows.map(r=>`<tr><td>${monthShort(r.ym)} ${r.ym.slice(0,4)}${r.bonus?'<span class="chip3">3 pays</span>':''}</td><td class="num">${fmt(r.income)}</td><td class="num">${fmt(r.bills+r.food)}</td><td class="num">${fmt(r.toSavings)}</td><td class="num">${fmt(r.em)}</td><td class="num">${fmt(r.ch)}</td></tr>`).join('');
  return`<section class="card"><div class="card-h"><div class="ttl">${ico('chart')}<h2>Next 6 months</h2></div><span class="small muted">If you stick to the plan</span></div>
   ${chartBox(spec)}
   <p class="small muted">Bars show the Emergency Savings balance at each month's end. * marks a 3-paycheck month.</p>
   <div class="tablewrap"><table><thead><tr><th>Month</th><th>Money in</th><th>Bills + food</th><th>Savings +/−</th><th>Emergency</th><th>Child Reserve</th></tr></thead><tbody>${table}</tbody></table></div></section>`;
}
function catCard(c){
  const entries=Object.entries(c.byCat).sort((a,b)=>b[1]-a[1]);
  if(!entries.length)return`<section class="card"><div class="card-h"><div class="ttl">${ico('pie','amber')}<h2>Spending in ${monthOnly(c.ym)}</h2></div></div><div class="empty">No spending logged yet. Tap <b>+ Log spending</b> after each purchase.</div></section>`;
  const max=Math.max(...entries.map(e=>e[1]));
  return`<section class="card"><div class="card-h"><div class="ttl">${ico('pie','amber')}<h2>Spending in ${monthOnly(c.ym)}</h2></div><span class="num small muted">${fmt(C.sum(entries.map(e=>e[1])))}</span></div><div class="cats">${entries.map(([k,v])=>`<div class="cat"><span>${esc(SPENDL[k]||k)}</span><div class="meter ${C.FOOD.has(k)?'food':''}"><span style="width:${v/max*100}%"></span></div><span class="num">${fmt(v)}</span></div>`).join('')}</div></section>`;
}

function vFixed(){
  const T=st(),s=T.settings,today=todayStr(),ym=S.activeYm,c=C.monthCalc(ym,T,today),g=S.group;
  const seg=Object.entries(GROUPS).map(([k,v])=>{const n=Object.values(S.bills).filter(b=>b&&(b.group||'adults')===k).length;
    return`<button class="${k}" aria-pressed="${g===k}" data-act="group" data-group="${k}"><b>${v.l}</b><span class="num">${fmt(c.byGroup[k]||0)}/mo</span><span class="small muted">${n} bill${n===1?'':'s'}</span></button>`}).join('');
  const bills=Object.entries(S.bills).filter(([,b])=>b&&(b.group||'adults')===g).sort((a,b)=>(a[1].name||'').localeCompare(b[1].name||''));
  const plan=Object.fromEntries(c.billLines.filter(l=>!l.deferredFrom).map(l=>[l.id,Object.assign({},l)]));
  c.billLines.filter(l=>l.deferredFrom).forEach(l=>{const t=plan[l.billId]||(plan[l.billId]={amount:0,dates:[]});t.amount=round2(t.amount+l.amount);t.inFrom=(t.inFrom||0)+l.amount;t.inMonth=l.deferredFrom});

      <div class="meta small muted">${esc(CATL[b.category]||'Other')} · ${esc(freqText(b,s,today))}${b.account?' · '+esc(acctName(b.account)):''}${b.method?' · '+esc(shortMethod(b.method)):''}</div>
      ${p&&p.setAside?`<div class="small muted">Set aside ${fmt(p.amount)} each month</div>`:''}${b.category==='housing'?'<div class="small" style="color:var(--adults)">Covered first by income set to "Covers rent first"</div>':''}</div>
      <div style="text-align:right"><div class="num" style="font-weight:600">${fmt(b.amount)}</div><div class="small muted">${p?(p.skipped?'skipped':fmt(p.amount))+' in '+monthShort(ym):'not this month'}</div></div>
      <div class="editcell"><button class="btn sm" data-act="edit-bill" data-id="${esc(id)}">Edit</button></div></div>`}).join('');

  return`<div class="view">${debtCard}<div class="seg" role="group" aria-label="Who the bill is for">${seg}</div>
    <section class="card"><div class="grouphead ${g}"><div><h2>${GROUPS[g].l}</h2><p class="small muted">${GROUPS[g].d}</p></div>${S.readOnly?'':`<button class="btn primary" data-act="add-bill" data-group="${g}">+ Add ${GROUPS[g].l.toLowerCase()} bill</button>`}</div>
    ${rows||`<div class="empty">No ${GROUPS[g].l.toLowerCase()} bills yet. Add the ones that repeat, like ${g==='baby'?'diapers and wipes':g==='pets'?'pet food and litter':'rent and phone plans'}.</div>`}

    <p class="small muted">Bills that come every 3 months or yearly are set aside a little each month, so the money is there when they're due. Mark bills paid from the Overview. Tag a bill non-essential or deferrable and you can skip it or pay it later in a month that comes up short.</p></div>`;

function vOneoff(){return vSpending()}

  const incs=c.incomes.map(inc=>{const one=inc.dates.length<=1&&!['weekly','biweekly','semimonthly'].includes((inc.sched||{}).type);

      <div class="fgrid"><div class="field"><label for="inc-amt-${esc(inc.id)}">${inc.dates.length>1?'Each payment':'Amount'}</label>${money('inc-amt-'+inc.id,inc.amount.toFixed(2),`data-inc="amt:${esc(inc.id)}"`)}<span class="hint">${c.odspCalc&&c.odspCalc.id===inc.id&&c.odspCalc.applied?`Worked out by the ODSP deductions below. Type an amount to use the real payment instead.`:from(inc.from)}</span></div>

      <div class="chips">${inc.dates.map(d=>`<span class="pill ${inc.bonusDates.includes(d)?'good':''}" style="font-size:.85rem;padding:5px 10px">${dLabel(d)}${inc.bonusDates.includes(d)?' · extra':''}</span>`).join('')||'<span class="small muted">Nothing this month</span>'}</div>
      ${inc.bonusDates.length?`<p class="small">Extra payday this month. It pays no bills and goes to Emergency Savings once any shortfall is covered.</p>`:''}</div>`}).join('');
  const crs=(c.crAll||[]).filter(x=>x.scheduled).map(x=>`<div class="field"><label for="inc-cr-${esc(x.id)}">${esc(x.name)} <span class="small muted">· ${x.dates.map(dShort).join(', ')}${x.estimated?' (estimate)':''}</span></label>${money('inc-cr-'+x.id,x.amount.toFixed(2),`data-inc="cr:${esc(x.id)}"`)}<span class="hint">${x.protect?'<span class="pill baby">Protected</span> ':''}${x.from===ym?'Set for this month':x.from?'Same as '+monthOnly(x.from):'The usual amount'}</span></div>`).join('');
  const past=ym<ymOf(today);

   <section class="card"><div class="card-h"><div class="ttl" style="align-items:flex-start">${ico('in')}<div><h2>Income for ${monthName(ym)}</h2><p class="small muted">Each month keeps its own amounts. Changing one month never changes the months before it. Set up income sources and benefits further down.</p></div></div>${c.closed?'<span class="pill lock">Locked</span>':''}</div>
   <div class="form">${incs||'<div class="empty">No income sources yet. Add them below.</div>'}

     <div class="fgrid"><div class="field"><label for="inc-other">Other one-off payment</label>${money('inc-other',c.otherCredit?c.otherCredit.toFixed(2):'','data-inc="otherCredit" placeholder="0.00"')}<span class="hint">Only counts for ${monthOnly(ym)}.</span></div></div>

   </section>
   ${odspCard(c)}
   ${incomeSetup()}
   <section class="card"><div class="card-h"><div class="ttl">${ico('lock')}<h2>Lock this month</h2></div></div>
     ${c.closed?`<p class="muted">${monthName(ym)} is locked. Its income, bills and totals are saved exactly as they were, even if you change bills later.</p><div style="margin-top:10px"><button class="btn" data-act="unlock" data-ym="${ym}">Unlock to make changes</button></div>`

const ODSP_T=[['','Not counted'],['dis','Work pay of a person with a disability (ODSP)'],['spouse','Work pay'],['full','Counted in full (EI, CPP, spousal support)']];

      ${tog('full','Income counted in full','EI and other chargeable income come off dollar for dollar.',false)}`};
  const ex=P.pays==='next'?'paid at the end of the month before':'paid on the 1st';
  return`<section class="card"><div class="card-h"><div class="ttl">${ico('receipt')}<h2>${esc(P.short)} deductions</h2></div><span class="small muted">${esc(src.name)}</span></div>

     ${P.assets?`<div class="field"><label for="ded-deps-${id}">Dependants (not counting a spouse)</label><input id="ded-deps-${id}" type="number" min="0" max="12" value="${esc(num(cfg.deps))}" data-ded="deps" data-sid="${id}" ${dis}><span class="hint">Adds ${fmt0(P.assets.dep)} each to the asset limit.</span></div>`:''}</div></div>

function incomeSetup(){const s=settings(),dis=S.readOnly?'disabled':'';return assistSetup()+`   <section class="card"><div class="card-h"><div class="ttl">${ico('in')}<h2>Paychecks and other income</h2></div>${S.readOnly?'':'<button class="btn sm" data-act="add-inc">+ Add income</button>'}</div>

     <div class="form">${C.incomesOf(s).filter(x=>!C.assistOf(x)).map((x,i)=>{const sc=x.sched||{},t=sc.type||'monthly',nxt=[];for(let k=0;k<3&&nxt.length<3;k++)nxt.push(...C.schedDates(sc,ymAdd(ymOf(todayStr()),k)).filter(d=>d>=todayStr()));
       const wd=isDate(sc.anchor)?C.parse(sc.anchor).getDay():1;

       <div class="fgrid"><div class="field"><label for="src-name-${i}">Name</label><input id="src-name-${i}" type="text" maxlength="40" value="${esc(x.name)}" data-src="${esc(x.id)}" data-srcf="name" ${dis}></div>
       <div class="field"><label for="src-amt-${i}">Usual amount each time</label><div class="money"><input id="src-amt-${i}" inputmode="decimal" value="${num(x.amount).toFixed(2)}" data-src="${esc(x.id)}" data-srcf="amount" ${dis}></div><span class="hint">Change a single month on the Income tab.</span></div></div>
       <div class="fgrid"><div class="field"><label for="src-type-${i}">How often</label><select id="src-type-${i}" data-src="${esc(x.id)}" data-srcf="type" ${dis}>${opts(INCOME_TYPES.filter(([k])=>k!=='odsp'),t)}</select></div>
       ${t==='monthly'?`<div class="field"><label for="src-day-${i}">Day of the month</label><input id="src-day-${i}" type="number" min="1" max="31" value="${esc(sc.day||1)}" data-src="${esc(x.id)}" data-srcf="day" ${dis}></div>`:''}
       ${t==='weekly'||t==='biweekly'?`<div class="field"><label for="src-wd-${i}">Day of the week</label><select id="src-wd-${i}" data-src="${esc(x.id)}" data-srcf="weekday" ${dis}>${WEEKDAYS.map((w,k)=>`<option value="${k}" ${k===wd?'selected':''}>${w}</option>`).join('')}</select></div>`:''}
       ${t==='biweekly'?`<div class="field"><label for="src-anchor-${i}">A payday in the cycle</label><input id="src-anchor-${i}" type="date" value="${esc(sc.anchor||'')}" data-src="${esc(x.id)}" data-srcf="anchor" ${dis}><span class="hint">Tells the tool which week it's paid. Any real payday works.</span></div>`:''}
       </div>
       <div class="fgrid"><div class="field"><label for="src-acct-${i}">Lands in</label><select id="src-acct-${i}" data-src="${esc(x.id)}" data-srcf="account" ${dis}><option value="">Main account</option>${acctOpts(x.account)}</select></div>
       <div class="field"><label for="src-role-${i}">What it's for</label><select id="src-role-${i}" data-src="${esc(x.id)}" data-srcf="role" ${dis}>${opts(ROLES,x.role||'other')}</select></div></div>
       ${hasAssist(s)?`<div class="fgrid"><div class="field"><label for="src-odsp-${i}">How assistance counts it</label><select id="src-odsp-${i}" data-src="${esc(x.id)}" data-srcf="odsp" ${dis}>${opts(ODSP_T.filter(([k])=>k!=='dis'||hasOdsp(s)||x.odsp==='dis'),x.odsp||'')}</select><span class="hint">Used by the deductions above.</span></div>
         ${(s.people||[]).length?`<div class="field"><label for="src-person-${i}">Whose income</label><select id="src-person-${i}" data-src="${esc(x.id)}" data-srcf="person" ${dis}><option value="">—</option>${opts(s.people,x.person||'')}</select><span class="hint">Two jobs for one person share one exemption.</span></div>`:''}</div>`:''}
       ${(()=>{const r=reportCfg(x);return`<div class="fgrid" style="align-items:end"><label class="check"><input type="checkbox" data-src="${esc(x.id)}" data-srcf="reportOn" ${r.on?'checked':''} ${dis}><span><b>Remind us to report income</b><br><span class="small muted">For programs that need a monthly income report.</span></span></label>
         ${r.on?`<div class="field"><label for="src-rep-${i}">Report due by day</label><input id="src-rep-${i}" type="number" min="1" max="28" value="${esc(r.day||7)}" data-src="${esc(x.id)}" data-srcf="reportDay" ${dis}></div>`:''}</div>`})()}
       <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="small muted">Next: ${nxt.slice(0,3).map(dShort).join(', ')||'—'}</span>${S.readOnly?'':`<button class="btn sm ghost danger" data-act="del-inc" data-id="${esc(x.id)}">Remove</button>`}</div></div></details>`}).join('')||'<div class="empty">No income yet. Add each paycheck or assistance payment.</div>'}</div></section>
   <section class="card"><div class="card-h"><div class="ttl">${ico('gift')}<h2>Government benefits and credits</h2></div></div>
     <p class="small muted" style="margin-bottom:10px">Pick a benefit and the tool knows its payment dates from the CRA and Service Canada published schedules, including bank holidays.</p>
     <div class="form">${C.creditsOf(s).map((x,i)=>{const nxt=[];for(let k=0;k<12&&nxt.length<3;k++)if(!isYm(x.start)||ymAdd(ymOf(todayStr()),k)>=x.start)nxt.push(...C.schedDates(C.creditSched(x),ymAdd(ymOf(todayStr()),k)).filter(d=>d>=todayStr()));
       return`<details class="item" data-keep="crd-${esc(x.id)}" ${S.open['crd-'+x.id]?'open':''}><summary class="itemsum"><span><b>${esc(C.creditName(x))}</b><span class="small muted"> · ${fmt(x.amount)}${x.protect?' · protected':''}${nxt[0]?' · next '+dShort(nxt[0]):''}</span></span><span class="chev" aria-hidden="true">›</span></summary><div class="itembody">
       <div class="card-h" style="margin:0"><b>${esc(C.creditName(x))}</b>${x.protect?'<span class="pill baby">Protected for the child</span>':'<span class="pill">Spendable</span>'}</div>
       <p class="small muted">${esc((C.CREDIT_TYPES[x.type]||{}).when||'')}</p>
       <div class="fgrid">${x.type==='other'?`<div class="field"><label for="crd-name-${i}">Name</label><input id="crd-name-${i}" type="text" maxlength="40" value="${esc(x.name||'')}" data-crd="${esc(x.id)}" data-crdf="name" ${dis}></div><div class="field"><label for="crd-day-${i}">Day of the month</label><input id="crd-day-${i}" type="number" min="1" max="31" value="${esc((x.sched||{}).day||15)}" data-crd="${esc(x.id)}" data-crdf="day" ${dis}></div>`:''}
       <div class="field"><label for="crd-amt-${i}">Usual amount each payment</label><div class="money"><input id="crd-amt-${i}" inputmode="decimal" value="${num(x.amount).toFixed(2)}" data-crd="${esc(x.id)}" data-crdf="amount" ${dis}></div></div>
       <div class="field"><label for="crd-acct-${i}">Lands in</label><select id="crd-acct-${i}" data-crd="${esc(x.id)}" data-crdf="account" ${dis}><option value="">Main account</option>${acctOpts(x.account)}</select></div>
       <div class="field"><label for="crd-start-${i}">First payment month (optional)</label><input id="crd-start-${i}" type="month" value="${esc(x.start||'')}" data-crd="${esc(x.id)}" data-crdf="start" ${dis}><span class="hint">For a benefit that hasn't started yet, like the CCB after the baby arrives.</span></div></div>
       <label class="check"><input type="checkbox" data-crd="${esc(x.id)}" data-crdf="protect" ${x.protect?'checked':''} ${dis}><span><b>Protected for the child</b><br><span class="small muted">Goes to the Child Reserve instead of everyday money.</span></span></label>
       <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="small muted">Next: ${nxt.slice(0,3).map(dShort).join(', ')||'—'}</span>${S.readOnly?'':`<button class="btn sm ghost danger" data-act="del-crd" data-id="${esc(x.id)}">Remove</button>`}</div></div></details>`}).join('')||'<div class="empty">No benefits added yet.</div>'}</div>
     ${S.readOnly?'':`<div class="daterow" style="margin-top:10px"><select id="new-crd" aria-label="Benefit to add">${Object.entries(C.CREDIT_TYPES).filter(([k,v])=>s.showAllProv||!v.prov||v.prov===(s.province||'ON')).map(([k,v])=>`<option value="${k}">${esc(v.name)}</option>`).join('')}</select><button class="btn" data-act="add-crd">Add</button></div>`}</section>
`}
function mkF(dis){return(id,label,val,type,hint,extra)=>`<div class="field"><label for="${id}">${label}</label>${type==='money'?`<div class="money"><input id="${id}" inputmode="decimal" value="${esc(val)}" data-set="${id.slice(4)}" data-type="money" ${dis}></div>`:`<input id="${id}" type="${type}" value="${esc(val)}" data-set="${id.slice(4)}" data-type="${type}" ${extra||''} ${dis}>`}${hint?`<span class="hint">${hint}</span>`:''}</div>`}
function vAccounts(){const s=settings(),dis=S.readOnly?'disabled':'',ck=lastCheckin(),today=todayStr();
  return`<div class="view">
   <section class="card"><div class="card-h"><div class="ttl">${ico('bank')}<h2>Balances</h2></div><button class="btn sm primary" data-act="checkin">Check my balances</button></div>
     ${ck&&ck.bal?`<p class="small muted" style="margin-bottom:8px">From your last balance check on ${dLabel(ck.date)}.</p><div class="list">${C.accountsOf(s).map(a=>`<div class="row"><span class="gdot ${a.type==='savings'?'in':'adults'}"></span><div><div class="nm">${esc(a.name)}</div><div class="meta">${esc((ACCT_TYPES.find(t=>t[0]===a.type)||[])[1]||'')}</div></div><div class="amt"><span class="num">${ck.bal[a.id]!=null?fmt(ck.bal[a.id]):'—'}</span></div></div>`).join('')}</div>`
      :'<p class="small muted">No balance check yet. Check your balances once a week so the tool can spot missing money.</p>'}</section>
   <section class="card"><div class="card-h"><div class="ttl">${ico('bank')}<h2>Accounts</h2></div>${S.readOnly?'':'<button class="btn sm" data-act="add-acct">+ Add an account</button>'}</div>
     <p class="small muted" style="margin-bottom:10px">Every account you use. Tick what each one is for and the tool works out where money should go: which account pays new bills, where food money goes, and where to send savings.</p>
     <details style="margin-bottom:10px"><summary>What the purposes mean</summary><div class="form" style="gap:6px">${PURPOSES.map(([k,l,d])=>`<p class="small"><b>${l}:</b> <span class="muted">${d}</span></p>`).join('')}<p class="small muted">Each purpose can be on one account only. Ticking one moves it. Savings accounts don't need a purpose; savings funds are kept in them.</p></div></details>
     ${!C.acctFor(s,'main')?'<p class="err" style="margin-bottom:10px">Tick "Main account" on one account so money moves can work.</p>':''}
     <div class="form">${accts().map((a,i)=>{const used=Object.values(S.bills).filter(b=>b&&C.acctId(s,b.account)===a.id).length;
       return`<details class="item" data-keep="acc-${esc(a.id)}" ${S.open['acc-'+a.id]?'open':''}><summary class="itemsum"><span><b>${esc(a.name)}</b><span class="small muted"> · ${esc((ACCT_TYPES.find(t=>t[0]===a.type)||[])[1]||'')}${a.type==='savings'?' · '+esc((SAV_KINDS.find(k=>k[0]===(a.kind||'hisa'))||[])[1]):(a.purposes||[]).map(k=>' · '+((PURPOSES.find(x=>x[0]===k)||[])[1]||'')).join('')}</span></span><span class="chev" aria-hidden="true">›</span></summary><div class="itembody">
       <div class="fgrid"><div class="field"><label for="acc-name-${i}">Name</label><input id="acc-name-${i}" type="text" maxlength="40" value="${esc(a.name)}" data-acc="${esc(a.id)}" data-accf="name" ${dis}></div>
       <div class="field"><label for="acc-type-${i}">Type</label><select id="acc-type-${i}" data-acc="${esc(a.id)}" data-accf="type" ${dis}>${opts(ACCT_TYPES,a.type)}</select></div></div>
       ${a.type==='savings'?`<div class="field"><label for="acc-kind-${i}">Kind of savings account</label><select id="acc-kind-${i}" data-acc="${esc(a.id)}" data-accf="kind" ${dis}>${opts(SAV_KINDS,a.kind||'hisa')}</select><span class="hint">TFSAs, RDSPs and RESPs get extra help on the Savings tab.</span></div>`:''}
       <fieldset style="border:0;padding:0;margin:0" ${a.type==='savings'?'hidden':''}><legend class="flabel" style="margin-bottom:6px">What it's for</legend><div class="chips">
       ${PURPOSES.map(([k,l])=>`<label><input type="checkbox" data-acc="${esc(a.id)}" data-accp="${k}" ${(a.purposes||[]).includes(k)?'checked':''} ${dis}><span>${l}</span></label>`).join('')}</div></fieldset>
       <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="small muted">${used?`Used by ${used} bill${used>1?'s':''}`:'Not used by any bills'}</span>${S.readOnly?'':`<button class="btn sm ghost danger" data-act="del-acct" data-acct="${esc(a.id)}">Remove account</button>`}</div></div></details>`}).join('')||'<div class="empty">No accounts yet. Add the accounts you use.</div>'}</div></section>
  </div>`}
function vSettings(){

  return`<div class="view">
   <section class="card"><div class="card-h"><div class="ttl">${ico('sparkle')}<h2>Appearance</h2></div><span class="small muted">Only changes this device</span></div>

     <div><span class="flabel">Colour theme</span><div class="swatches" role="radiogroup" aria-label="Colour theme" style="margin-top:8px">${Object.entries(PALETTES).map(([k,p])=>`<label class="sw"><input type="radio" name="pal" value="${k}" ${APPEAR.pal===k?'checked':''}><span style="--a:${p.l[0]};--b:${p.l[1]}"></span><b>${p.name}</b></label>`).join('')}</div></div>
     <div><span class="flabel">Light or dark</span><div class="segctl" role="group" aria-label="Light or dark" style="margin-top:8px;display:flex">${[['auto','Match device'],['light','Light'],['dark','Dark']].map(([k,l])=>`<button data-act="mode" data-m="${k}" aria-pressed="${APPEAR.mode===k}">${l}</button>`).join('')}</div></div>
     <div class="switch"><div><b>Visual effects</b><p class="small muted">Animations, moving colour and blur. Turn off for a calmer screen or to save battery on an older phone.</p></div>
     <input type="checkbox" id="fx-toggle" role="switch" aria-label="Visual effects" ${FX.on?'checked':''}></div></div></section>
   <section class="card"><div class="card-h"><div class="ttl">${ico('in')}<div><h2>Backup and moving to another phone</h2><p class="small muted">Your budget is saved only on this device. Nothing is sent anywhere and no account is needed.</p></div></div></div>
     <p class="small" style="margin-bottom:10px">${meta().lastBackup?`Last backup: <b>${dLabel(meta().lastBackup.slice(0,10))}</b>`:'<b>No backup yet.</b> If this phone is lost, reset or its browser data is cleared, the budget is gone.'}</p>
     <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="export">Export an encrypted backup</button><button class="btn" data-act="import">Import a backup</button></div>
     <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center"><span class="small muted">Spreadsheet copies (not encrypted):</span><button class="btn sm" data-act="csv" data-kind="spending">Spending (CSV)</button><button class="btn sm" data-act="csv" data-kind="bills">Bills (CSV)</button></div>
     <p class="small muted" style="margin-top:10px">To use the budget on another phone, export a backup here, send the file to that phone (email, text or cloud drive), open this page there and import it. Importing replaces whatever is on that phone.</p></section>
   <nav class="jump" aria-label="Jump to a section">${jumps.map(j=>`<button data-act="jump" data-to="${esc(j)}">${esc(j)}</button>`).join('')}</nav>
   <section class="card"><div class="card-h"><div class="ttl">${ico('users')}<h2>Household</h2></div></div><div class="fgrid">
     <div class="field"><label for="set-householdName">Household name</label><input id="set-householdName" type="text" maxlength="40" value="${esc(s.householdName||'')}" data-set="householdName" data-type="text" placeholder="e.g. The Smiths, or Sam & Alex" ${dis}><span class="hint">Shown at the top of the page.</span></div>
     <div class="field"><label for="set-people">People who spend money</label><input id="set-people" type="text" maxlength="120" value="${esc((s.people||[]).join(', '))}" data-set="people" data-type="list" placeholder="e.g. Sam, Alex" ${dis}><span class="hint">Separate names with commas. Lets you tag who paid when logging spending.</span></div></div>
     <label class="check" style="margin-top:12px"><input type="checkbox" data-set="taxReminder" data-type="bool" ${s.taxReminder!==false?'checked':''} ${dis}><span><b>Tax filing reminder</b><br><span class="small muted">From February to April 30, a reminder to file, since benefits depend on it.</span></span></label></section>
   <section class="card"><div class="card-h"><div class="ttl">${ico('bolt')}<h2>Quick buttons</h2></div></div><p class="small muted" style="margin-bottom:10px">One-tap spending buttons on the Today screen. Add one by ticking "Add a quick button" when you log spending. Dashed buttons are suggestions based on what you log often.</p>
     <div class="list">${(s.quick||[]).map((q,i)=>`<div class="row"><span class="gdot in"></span><div><div class="nm">${esc(q.note||SPENDL[q.category]||'')}</div><div class="meta">${esc(SPENDL[q.category]||'')}</div></div><div class="amt"><span class="num">${fmt(q.amount)}</span><button class="btn sm ghost danger" data-act="del-quick" data-i="${i}" ${dis}>Remove</button></div></div>`).join('')||'<div class="empty small">No saved quick buttons yet.</div>'}</div></section>
   <section class="card"><div class="card-h"><div class="ttl">${ico('cal')}<h2>Plan dates</h2></div></div><div class="form"><div class="fgrid">

     ${f('set-upcomingDays','Days to show in Coming up',s.upcomingDays,'number','','min="3" max="31"')}
   </div></div></section>
   <section class="card"><div class="card-h"><div class="ttl">${ico('map')}<h2>Province and bank holidays</h2></div></div>

     <p class="small muted" style="margin-bottom:10px">Payments due on these days arrive the business day before. Provincial holidays are listed too, but banks still process payments on them.</p>
     ${[ +todayStr().slice(0,4), +todayStr().slice(0,4)+1].map(y=>`<details ${y===+todayStr().slice(0,4)?'':''}><summary>${y}</summary><div class="list">${C.holidaysOf(y,s.province||'ON').map(x=>`<div class="row"><span class="gdot ${x.bank?'adults':''}"></span><div><div class="nm">${esc(x.name)}</div><div class="meta">${x.bank?'Banks closed':'Provincial holiday · banks open'}</div></div><div class="amt small">${dLabel(x.date)}</div></div>`).join('')}</div></details>`).join('')}</section>

     ${hasExamples()&&!S.readOnly?`<div style="margin-top:10px"><button class="btn danger" data-act="clear-examples">Clear example data</button></div>`:''}</section>`:''}
   <section class="card"><div class="card-h"><div class="ttl">${ico('trash','red')}<h2>Start over</h2></div></div><p class="muted">Erase the whole budget from this device. Export a backup first if you might want it back.</p>
     <div style="margin-top:10px"><button class="btn danger" data-act="wipe">Erase everything on this device</button></div></section></div>`;
}

/* ---------- sheets ---------- */
const overlay=document.getElementById('overlay'),sheet=document.getElementById('sheet');
function openSheet(html,focusId){sheet.innerHTML=html;overlay.hidden=false;document.getElementById('fab').hidden=true;setTimeout(()=>{const el=focusId&&document.getElementById(focusId);if(el)el.focus()},30)}
function closeSheet(){overlay.hidden=true;sheet.innerHTML='';S.sheet=null;render()}
const opts=(arr,sel)=>arr.map(a=>{const[k,l]=Array.isArray(a)?a:[a,a];return`<option value="${esc(k)}" ${k===sel?'selected':''}>${esc(l)}</option>`}).join('');
function logSheet(oneTime){
  const t=todayStr(),y=addDays(t,-1);
  S.sheet=oneTime?'oneoff':'log';
  const head=`<div class="sheet-h"><h2 id="sheet-title">${oneTime?'Add a one-time expense':'Log spending'}</h2><button class="x" data-act="sheet-close" aria-label="Close">×</button></div>`;
  if(oneTime)return openSheet(head+`<form class="form" id="expForm" novalidate data-onetime="1">
    <div class="field"><label for="f-note">What is it?</label><input id="f-note" type="text" placeholder="Car seat, vet visit, birthday gift…" maxlength="80"></div>
    <div class="fgrid"><div class="field"><label for="f-amt">Amount</label><div class="money"><input id="f-amt" inputmode="decimal" placeholder="0.00"></div></div>
    <div class="field"><label for="f-date">Date (today or later)</label><input id="f-date" type="date" value="${t}"></div></div>
    <div class="field"><label for="f-group">Who it's for</label><select id="f-group">${opts(Object.entries(OGROUPS),'household')}</select></div>

function takeSnap(){if(backend&&backend.all)S.snap={data:JSON.stringify(backend.all()),at:Date.now()}}

function toast(msg,noUndo){const el=document.getElementById('toast');const canUndo=!noUndo&&changedSinceSnap();
  if(canUndo)S.undo=S.snap.data;
  el.innerHTML=`<span>${esc(msg)}</span>${canUndo?'<button class="undo" data-act="undo">Undo</button>':''}`;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{el.hidden=true;if(canUndo)S.undo=null},canUndo?7000:3200)}

sheet.addEventListener('submit',async e=>{

async function copyLegacy(force){
  try{
    if(!(window.claude&&window.claude.use))return false;
    const user=await window.claude.use('user');if(!user||!(await user.isOwner()))return false;
    const db=await window.claude.use('db');if(!db)return false;
    const flag=await db.doc('meta/migration').get();
    if(flag.exists&&!force){S.legacyOffer=true;schedule();return false}
    const out={};const put=(p,s)=>{if(s&&s.exists)out[p]=JSON.parse(JSON.stringify(s.data()))};
    put('settings/main',await db.doc('settings/main').get());
    (await db.collection('bills').get()).docs.forEach(d=>put('bills/'+d.id,d));
    const ms=await db.collection('months').get();ms.docs.forEach(d=>put('months/'+d.id,d));
    const yms=new Set(ms.docs.map(d=>d.id));const cur=ymOf(todayStr());for(let ym=ymAdd(cur,-14);ym<=ymAdd(cur,14);ym=ymAdd(ym,1))yms.add(ym);
    for(const ym of yms){const q=await db.collection('months/'+ym+'/expenses').get();q.docs.forEach(d=>put('months/'+ym+'/expenses/'+d.id,d))}
    if(!Object.keys(out).length)return false;
    backend.replaceAll(out);S.legacyOffer=false;S.lastKey=null;
    try{await db.doc('meta/migration').set({movedOn:todayStr()})}catch(e){}
    return true;
  }catch(e){console.warn('migration',e);return false}
}
async function init(){
  backend=Local();S.mode='local';
  S.activeYm=defaultYm();
  backend.subDoc('settings/main',d=>{S.settings=d;S.loaded.settings=true;if(!S.navTouched)S.activeYm=defaultYm();ensureExpenseSubs();schedule()});
  backend.subColl('bills',o=>{S.bills=o;S.loaded.bills=true;schedule()});
  backend.subColl('months',o=>{S.months=o;S.loaded.months=true;schedule()});
  backend.subColl('checkins',o=>{S.checkins=o;schedule()});
  ensureExpenseSubs();
  /* first time on this device: bring over the earlier online budget, if this is its owner */
  if(backend.isEmpty()){const moved=await copyLegacy(false);if(moved){S.firstMove=true;setTimeout(()=>toast('Your budget is now saved on this device. Make a backup next.'),400)}}
  /* remember when the plan started so dates don't drift */
  setTimeout(()=>{const raw=S.settings||{};if(!backend.isEmpty()&&(!isYm(raw.startYm)||!isDate(raw.trackFrom))){const s=settings();saveSettings({startYm:s.startYm,trackFrom:s.trackFrom})}},300);
  let day=todayStr();setInterval(()=>{if(todayStr()!==day){day=todayStr();if(!S.navTouched)S.activeYm=defaultYm();ensureExpenseSubs();schedule()}},60000);
}
init();
init();
})();
</script>
