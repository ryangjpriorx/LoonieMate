name: Build

# Every change: check the app's engine against the web version, run the tests, and build a test copy of the app.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Work out the web version's answers
        run: node parity/gen.js

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the app engine matches the web version
        run: |
          set -o pipefail
          ./gradlew :engine:test --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Build a test copy of the app
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Draw every screen
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Publish the screenshots to the 'screens' branch
        if: always() && github.event_name == 'push'
        run: |
          [ -d app/build/screens ] && [ -n "$(ls app/build/screens)" ] || exit 0
          cd app/build/screens
          git init -q -b screens
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "Screens for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" screens

      - name: Show what went wrong
        if: failure()
        run: .github/report-errors.sh "$RUNNER_TEMP/build.log"

      - uses: actions/upload-artifact@v4
        with:
          name: LoonieMate-test-build
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
