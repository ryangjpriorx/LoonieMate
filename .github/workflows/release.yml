name: Release

# Changing version.txt on main (for example to 0.2.0) builds a signed LoonieMate and publishes it as
# release v0.2.0 on the Releases page. Phones running LoonieMate find it there and offer the update.
# Release notes come from docs/releases/v0.2.0.md. A version that's already released is skipped.
on:
  push:
    branches: [main]
    paths: ['version.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Version from version.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME="$(tr -d ' \r\n' < version.txt)"
          TAG="v$VERSION_NAME"
          IFS=. read -r MA MI PA <<< "${VERSION_NAME%%-*}"
          VERSION_CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          if [ "$VERSION_CODE" -le 0 ]; then echo "::error::version.txt must hold a version like 1.2.3"; exit 1; fi
          if gh release view "$TAG" >/dev/null 2>&1; then echo "SKIP=1" >> "$GITHUB_ENV"; echo "$TAG is already released."; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "LoonieMate $VERSION_NAME (version code $VERSION_CODE)"

      - uses: actions/setup-node@v5
        if: env.SKIP != '1'
        with:
          node-version: 22
      - run: node parity/gen.js
        if: env.SKIP != '1'

      - uses: actions/setup-java@v5
        if: env.SKIP != '1'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: env.SKIP != '1'

      - name: Unlock the signing key
        if: env.SKIP != '1'
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$SIGNING_PASSPHRASE" ]; then echo "::error::Add the SIGNING_PASSPHRASE secret (Settings → Secrets and variables → Actions) so releases can be signed."; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in signing/release.jks.enc -out "$RUNNER_TEMP/release.jks" -pass env:SIGNING_PASSPHRASE
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        if: env.SKIP != '1'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_PASSPHRASE }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_PASSPHRASE }}
          SIGNING_KEY_ALIAS: looniemate
        run: |
          set -o pipefail
          ./gradlew :engine:test :app:assembleRelease --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show what went wrong
        if: (failure()) && env.SKIP != '1'
        run: .github/report-errors.sh "$RUNNER_TEMP/build.log"

      - name: Package the release
        if: env.SKIP != '1'
        run: |
          APK="LoonieMate-$VERSION_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c %s "$APK")
          NOTES_FILE="docs/releases/$TAG.md"
          if [ -f "$NOTES_FILE" ]; then cp "$NOTES_FILE" notes.md; else git log -1 --pretty=%B > notes.md; fi
          export APK SHA SIZE
          node -e '
            const fs=require("fs");const e=process.env;
            fs.writeFileSync("update.json",JSON.stringify({versionCode:+e.VERSION_CODE,versionName:e.VERSION_NAME,apk:e.APK,
              url:`https://github.com/${e.GITHUB_REPOSITORY}/releases/download/${e.TAG}/${e.APK}`,sha256:e.SHA,size:+e.SIZE,minSdk:26,
              notes:fs.readFileSync("notes.md","utf8").trim()},null,2));' 
          cat update.json
          echo "APK=$APK" >> "$GITHUB_ENV"
        env:
          APK: LoonieMate-${{ env.VERSION_NAME }}.apk

      - name: Publish on the Releases page
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$APK" update.json --target "$GITHUB_SHA" --title "LoonieMate $VERSION_NAME" --notes-file notes.md --latest
